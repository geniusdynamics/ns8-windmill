#
# Windmill state include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
#

# PostgreSQL password and connection URL
state/passwords.env

# Dump of the whole PostgreSQL cluster, written by module-dump-state. The
# live database volume is not saved: a copy of a running database is not
# consistent, so restore rebuilds it from this dump.
state/windmill.sql
